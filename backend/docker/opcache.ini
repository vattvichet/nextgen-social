; Production OPcache settings. validate_timestamps=0 means code changes
; require a container rebuild/restart to take effect (intentional for an
; immutable image) - flip it to 1 with a low revalidate_freq for local dev.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
