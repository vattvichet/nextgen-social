### -------------------------- Without Caddy running (If you want to only expose the port)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "9000"
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 256m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

