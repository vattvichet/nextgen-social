services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "9000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME: ${VITE_APP_NAME}
    # expose:
    #   - "80"
    ports:
      - "2003:80"
    depends_on:
      - backend
    restart: unless-stopped

