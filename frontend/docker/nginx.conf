
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls straight to the backend's php-fpm container over
    # the internal Docker network (compose service name "backend") - the
    # browser only ever talks to this one origin, so no CORS/public API
    # subdomain is needed. SCRIPT_FILENAME is hardcoded to the path Laravel
    # actually lives at inside the backend image (see backend/Dockerfile's
    # WORKDIR), since this nginx has no local copy of the PHP app itself.
location /api/ {
    fastcgi_pass backend:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_read_timeout 5s;
}

    # React Router client-side routing: fall back to index.html for
    # any path that isn't a real static file.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
